name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: apk variant to build
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.1"
          validate-wrappers: false

      - name: test protocol
        run: gradle :protocol:test --no-daemon

      - name: assemble debug
        if: ${{ inputs.variant != 'release' }}
        run: gradle :app:assembleDebug --no-daemon

      - name: assemble release
        if: ${{ inputs.variant == 'release' }}
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: openlotus-${{ inputs.variant || 'debug' }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
